name: release firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      - name: Build product firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          sed -i "s/^CONFIG_APP_PROJECT_VER=.*/CONFIG_APP_PROJECT_VER=\"$GITHUB_REF_NAME\"/" sdkconfig.defaults
          idf.py set-target esp32s3
          idf.py build
          idf.py size
          test "$(stat -c %s build/Read_Pico.bin)" -le 4194304
          mkdir -p build
          idf.py merge-bin -o build/pico-os-merged.bin
          cp build/Read_Pico.bin build/pico-os-app.bin
          sha256sum build/pico-os-app.bin | awk '{print $1 "  pico-os-app.bin"}' > build/pico-os-app.bin.sha256
          mkdir -p public
          cp -R web/. public/
          python3 -c 'import json,sys; p="public/manifest.json"; d=json.load(open(p)); d["version"]=sys.argv[1]; json.dump(d,open(p,"w"),ensure_ascii=False,indent=2); print()' "$GITHUB_REF_NAME"
          cp build/pico-os-merged.bin public/pico-os-merged.bin

      - name: Publish firmware asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/pico-os-merged.bin
            build/pico-os-app.bin
            build/pico-os-app.bin.sha256

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - name: Deploy firmware flasher
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
