name: release firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      - name: Build product firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin -o pico-os-merged.bin
          mkdir -p public
          cp -R web/. public/
          cp build/pico-os-merged.bin public/pico-os-merged.bin

      - name: Publish firmware asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/pico-os-merged.bin

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - name: Deploy firmware flasher
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
